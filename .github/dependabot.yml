version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

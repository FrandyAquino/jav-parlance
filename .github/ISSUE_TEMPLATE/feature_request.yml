name: Feature request
description: Describe a user problem and a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap and existing issues first. Parlance keeps inference on-device.
        Please explain the user need before proposing a specific implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who encounters it and a concrete situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would someone be able to do after this change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include workarounds, relevant platforms, and any performance or privacy constraints.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to help?
      options:
        - "I can help test it"
        - "I can help implement it"
        - "I am sharing an idea"

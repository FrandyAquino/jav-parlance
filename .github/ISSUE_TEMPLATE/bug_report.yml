name: Bug report
description: Report a reproducible problem with capture, transcription, translation, or the app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Parlance. Search existing issues first.
        Use synthetic or public-domain speech when possible. Do not include private
        meeting content, credentials, or personal information in logs or screenshots.
        Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: build
    attributes:
      label: Build or commit
      description: Include the commit SHA, CI run, or installer artifact you used.
      placeholder: "Commit SHA or CI run URL"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, CPU/GPU, audio source, selected models and languages. Include browser/version for tab capture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional. Remove private content and tokens before posting.
